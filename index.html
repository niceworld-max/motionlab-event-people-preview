<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>MotionLab — 행사와 사람 모션 미리보기</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f0;color:#263322;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:1240px;margin:0 auto;padding:22px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.brand{font-size:17px;font-weight:750;letter-spacing:-.03em}.tag{font-size:11px;border:1px solid #d7dfd0;border-radius:20px;padding:6px 10px;color:#5b6c53}.stage{background:#edf2e8;border:1px solid #dfe6d7;border-radius:18px;overflow:hidden}video{display:block;width:100%;height:auto;aspect-ratio:8/5;max-height:78vh;object-fit:contain;background:#f4f7f0}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:15px}button,a.button{font:inherit;font-size:13px;background:#fff;color:#2f6b2b;border:1px solid #d1ddc6;border-radius:24px;padding:0 15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}button:hover,a.button:hover{background:#e8f0e0}button:focus-visible,a:focus-visible{outline:3px solid #2f6b2b;outline-offset:3px}.meta{font-size:12px;color:#6a795f;margin-left:auto}footer{font-size:11px;color:#76826e;line-height:1.8;margin-top:14px}footer a{color:#526d45}#hint{font-size:12px;color:#426335;min-height:20px;margin-top:7px}@media(max-width:650px){main{padding:15px 10px}.brand{font-size:15px}.tag{font-size:10px}.meta{width:100%;margin:3px 0 0}video{max-height:none}.stage{border-radius:12px}}</style></head><body><main><header><span class="brand">MotionLab / 행사와 사람</span><span class="tag">검토용 모션 미리보기</span></header><section class="stage" aria-label="모션 영상"><video id="motion" src="motion.mp4" poster="poster.jpg" controls muted loop playsinline preload="auto" aria-label="행사·참석자 사진과 예시 서비스 UI가 입체적으로 움직이는 무음 영상"></video></section><nav aria-label="영상 조작"><button id="replay">↺ 처음부터 다시 보기</button><button id="fullscreen">전체 화면</button><a class="button" href="motion.mp4" target="_blank" rel="noopener noreferrer">영상만 열기</a><a class="button" href="full-image.jpg" target="_blank" rel="noopener noreferrer">전체 이미지 보기</a><span class="meta">14.5초 · 1440×900 · 60fps · 무음</span></nav><div id="hint" role="status"></div><footer>무료 스톡 행사·참석자 사진과 자체 제작 예시 UI를 사용한 시안입니다. 실제 시공지 고객사 행사나 해당 인물의 추천을 의미하지 않습니다.<br>회사 홈페이지와 분리된 모션 확인용 페이지입니다. <a href="credits.html">사진 출처·이용 조건</a></footer></main><script>const v=document.getElementById('motion'),h=document.getElementById('hint'),reduced=matchMedia('(prefers-reduced-motion: reduce)');function start(){v.play().then(()=>h.textContent='').catch(()=>h.textContent='자동 재생이 제한된 브라우저에서는 영상의 ▶ 버튼을 눌러 주세요.')}document.getElementById('replay').onclick=()=>{v.currentTime=0;start()};document.getElementById('fullscreen').onclick=()=>{if(v.requestFullscreen)v.requestFullscreen().catch(()=>{});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()};v.addEventListener('loadeddata',()=>{if(!reduced.matches)start();else h.textContent='모션 감소 설정이 적용되어 있습니다. 원할 때 ▶ 버튼으로 재생해 주세요.'},{once:true});v.addEventListener('error',()=>h.textContent='영상 로딩에 문제가 있으면 ‘영상만 열기’를 눌러 확인해 주세요.');reduced.addEventListener('change',()=>{if(reduced.matches){v.pause();v.loop=false}else v.loop=true});</script></body></html>
